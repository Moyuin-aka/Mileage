name: Tauri Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'app-v*.*.*'
      - 'mileage-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  CARGO_TERM_COLOR: always
  RELEASE_BODY: |
    Mileage desktop and Android client builds.

    Desktop clients connect to your Mileage service URL and access password.
    Android APKs are release builds intended for sideload testing.

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg

          - name: macOS x64
            platform: macos-latest
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg

          - name: Windows x64
            platform: windows-latest
            rust-targets: ''
            args: --bundles nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION="$(node -p "require('./frontend/package.json').version")"
            TAG="mileage-v${VERSION}"
          fi

          VERSION="${TAG#v}"
          VERSION="${VERSION#app-v}"
          VERSION="${VERSION#mileage-v}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Mileage v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust-targets != ''
        run: rustup target add ${{ matrix.rust-targets }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build and upload desktop bundles
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          tagName: ${{ steps.release_meta.outputs.tag }}
          releaseName: ${{ steps.release_meta.outputs.name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          retryAttempts: 2
          args: ${{ matrix.args }}

  android:
    name: Android APK arm64
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION="$(node -p "require('./frontend/package.json').version")"
            TAG="mileage-v${VERSION}"
          fi

          VERSION="${TAG#v}"
          VERSION="${VERSION#app-v}"
          VERSION="${VERSION#mileage-v}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Mileage v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "ndk;27.2.12479018"

          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Initialize Android project
        working-directory: frontend
        shell: bash
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run tauri -- android init
          fi

      - name: Set up Android signing
        working-directory: frontend
        shell: bash
        run: |
          test -n "${{ secrets.ANDROID_KEY_BASE64 }}" || (echo "Missing ANDROID_KEY_BASE64 secret" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)

          mkdir -p src-tauri/gen/android

          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > src-tauri/gen/android/keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> src-tauri/gen/android/keystore.properties

          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/mileage-upload-keystore.jks"
          echo "storeFile=$RUNNER_TEMP/mileage-upload-keystore.jks" >> src-tauri/gen/android/keystore.properties

      - name: Build Android arm64 release APK
        working-directory: frontend
        shell: bash
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: npm run tauri -- android build --apk --target aarch64

      - name: Upload Android APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mileage-android-arm64-apk
          path: frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
          files: frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}