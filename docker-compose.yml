services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mileage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mileage_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mileage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mileage} -d ${POSTGRES_DB:-mileage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      args:
        NPM_PROXY: ${NPM_PROXY:-}
    restart: unless-stopped
    dns:
      - ${API_DNS_PRIMARY:-1.1.1.1}
      - ${API_DNS_SECONDARY:-8.8.8.8}
    environment:
      PORT: 8080
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD is required}
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      DATABASE_URL: postgres://${POSTGRES_USER:-mileage}:${POSTGRES_PASSWORD:-mileage_dev_password}@db:5432/${POSTGRES_DB:-mileage}
      DB_POOL_SIZE: 10
      OCR_TIMEOUT_MS: ${OCR_TIMEOUT_MS:-90000}
      OCR_MAX_UPLOAD_BYTES: ${OCR_MAX_UPLOAD_BYTES:-8388608}
      OCR_OMP_NUM_THREADS: ${OCR_OMP_NUM_THREADS:-1}
      ALL_PROXY: ${NPM_PROXY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8088}:80"

volumes:
  pgdata:
